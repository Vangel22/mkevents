name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so a developer and the pipeline cannot drift apart.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # dist/ is committed, because eventapp installs this package straight from
      # git and a git install runs no build step. So the built output is what
      # consumers actually import, and a stale one ships silently — the source
      # looks right in review while the published behaviour is last week's.
      - name: Check the committed build matches the source
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is stale. Run 'pnpm build' and commit the result."
            exit 1
          fi
